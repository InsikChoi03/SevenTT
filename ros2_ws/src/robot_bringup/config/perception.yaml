# Parameters for the main match bringup.
# This file is intentionally kept in sync with the live mapping/test-field model so the main
# 경기 실행도 같은 wall-mask map correction, object-flow, landmark tracking, and visualization
# pipeline을 사용한다.
#
# !!! FILL IN before running !!!
#   set1_label / set2_label : the shape and fruit you actually place out
#                             (set1_label one of cube/octahedron/dodecahedron/icosahedron;
#                              set2_label one of apple/orange/banana/pineapple).
#   shape_target_total / fruit_target_total : how many of each you place.
# With the labels left empty the robot still roams + maps + logs recognition; for the current run
# Set1 is configured as icosahedron.
#
# Calibration values (wide fisheye intrinsics/extrinsics) are the current live-map values.
# Model / homography / output paths are absolute so they resolve regardless of launch CWD.

localizer_node:
  ros__parameters:
    # 시작: 4×4 경기장 우측하단 구석, 모서리서 20cm 안쪽, 경기장 왼쪽을 바라봄.
    # (중심원점 field. rotate_180 맵에서 우측하단=(-1.8,1.8), 왼쪽바라봄=theta 0. 맵 보고 안 맞으면 조정)
    initial_x: -1.8
    initial_y: 1.8
    initial_theta: 0.0
    publish_rate_hz: 20.0
    use_visual_odometry: true
    use_landmark_correction: false        # no arena walls -> disable cardinal yaw-snap
    use_object_landmarks: true            # correct x/y drift from re-observed mapped objects; theta stays IMU-only
    landmark_gain: 0.5                     # 위치 보정만 중간 강도로 사용
    landmark_theta_gain: 0.0               # HEADING은 IMU만 사용하고 landmark heading 보정은 끔
    landmark_max_step_m: 0.2               # 한 번에 허용하는 위치 보정폭↑(드리프트 즉시 회수)
    landmark_max_step_rad: 0.0             # landmark가 heading을 바꾸지 못하게 함
    landmark_correction_max_speed_mps: 0.20 # landmark 보정을 물리적으로 가능한 pose 변화 속도로 제한
    landmark_correction_max_dt_sec: 0.10   # 프레임 공백 뒤 한 번에 큰 위치 보정을 적용하지 않음
    broadcast_tf: true
    use_wheel_odom: false             # 엔코더 기반 위치/회전 보정 사용 안 함
    # OBJECT-FLOW = 주(主) 회전 소스: 광각 물체점 프레임간 매칭(world_model). LK 옵티컬플로는 진동을
    # 회전으로 착각하지만 물체점은 실제 세계 근거라 정지 시 0을 낸다. 물체 부족 시에만 LK로 폴백.
    use_object_flow: true
    object_flow_min_conf: 0.25            # 이 신뢰도 미만 flow 추정은 무시
    object_flow_stale_sec: 0.5            # flow가 이보다 오래되면 LK VO 폴백 기동
    object_flow_trans: true              # 물체 흐름 병진도 사용. localizer가 wheel과 중복되지 않게 조정함.
    # 엔코더 odom: 현재 FL(앞왼쪽) 엔코더가 불량/초음파 핀과 충돌하므로 FR/RL/RR 3개만 사용한다.
    # FL 엔코더 복구 후 [true, true, true, true]로 되돌려 4륜 평균을 쓴다.
    wheel_odom_enabled_wheels: [false, true, true, true]
    wheel_odom_deadband_mps: 0.005
    stationary_wheel_eps_mps: 0.02
    stationary_cmd_eps: 0.03
    stationary_required_sec: 0.8
    suppress_object_flow_when_stationary: false  # 상태 오판으로 실제 이동을 막지 않음
    freeze_pose_when_stationary: true
    wall_anchor_gain: 0.50
    wall_anchor_max_step_m: 0.03
    wall_anchor_max_step_rad: 0.0          # 벽 anchor는 위치만 보정, heading은 IMU만 사용
    wall_anchor_deadband_m: 0.005
    wall_field_gain: 0.35
    wall_field_max_step_m: 0.05
    wall_field_max_step_rad: 0.0           # 벽 field 보정은 heading을 바꾸지 않음
    wall_field_deadband_m: 0.005
    wall_correction_stale_sec: 1.5
    use_imu_heading: true                 # IMU heading 보정 ON: 벽 보정 OFF 조건 비교 테스트
    imu_motion_smoothing_enabled: false   # STOP/ROTATING/IMPACT 상태별 고정 병진 감쇠 비활성화
    imu_flow_consistency_enabled: true    # 이전 flow 속도+IMU 가속도로 급격한 flow 변화만 연속 감쇠
    imu_flow_min_gain: 0.10               # 큰 값도 폐기하지 않는 최소 반영 gain
    imu_flow_full_trust_error_mps: 0.15   # 이 속도 오차 이하는 flow 전량 반영
    imu_flow_soft_error_mps: 0.40         # 이 속도 오차 이상은 최소 gain 적용
    imu_flow_accel_deadband_mps2: 0.20    # IMU 평면 가속도 노이즈 제거
    imu_flow_accel_clip_mps2: 1.50        # 충격 가속도 제한
    imu_flow_accel_bias_alpha: 0.01       # 기울기/저주파 bias 추종 계수
    imu_flow_accel_filter_alpha: 0.25     # 평면 가속도 저역통과 계수
    imu_flow_max_dt_sec: 0.30             # 긴 flow 공백에서는 속도 예측 초기화
    imu_motion_publish_debug: true        # /localization/imu_motion_state 발행
    imu_stationary_gyro_eps_radps: 0.035
    imu_stationary_accel_norm_eps: 0.35
    imu_stationary_accel_var_eps: 0.10
    imu_rotating_gyro_eps_radps: 0.18
    imu_impact_accel_norm_eps: 1.50
    imu_impact_accel_delta_eps: 1.20
    imu_object_flow_stationary_gain: 0.10
    imu_object_flow_rotating_trans_gain: 0.30
    imu_object_flow_impact_gain: 0.20
    imu_landmark_impact_gain: 0.40
    imu_wall_rotating_gain: 0.60
    imu_wall_impact_gain: 0.50
    fisheye_model: true
    # Intrinsics SCALED for the 1280x960 GPU-downscaled wide stream (was 1640x1232). fx,cx x0.780488
    # (1280/1640); fy,cy x0.779221 (960/1232). dist_coeffs are ray-normalized -> resolution-invariant.
    # MUST stay identical to the world_model_node block below.
    top_fx: 669.125
    top_fy: 670.185
    top_cx: 616.474
    top_cy: 422.141
    dist_coeffs: [-0.085721, 0.053910, -0.034649, 0.007943]

wall_localizer_node:
  ros__parameters:
    # 학습 mask의 median 중심과 주 방향으로 만든 선분을 경기장 벽 관측으로 바로 사용한다.
    # 기존 Canny/Hough 후보와 경기장 축/예상 벽 위치 기반 빨간 선분 승인·위치보정은 사용하지 않는다.
    top_fx: 669.125
    top_fy: 670.185
    top_cx: 616.474
    top_cy: 422.141
    dist_coeffs: [-0.085721, 0.053910, -0.034649, 0.007943]
    image_rotated_180: true
    wide_homography_path: "/home/seventt/seventt/workspace/data/calib/wide_ground.npz"
    rate_hz: 3.0
    ignore_robot_rect: [0.34, 0.25, 0.66, 0.88]
    max_range_m: 2.3
    use_segmentation_mask: true
    segmentation_model_path: "/home/seventt/seventt/workspace/models/wall_floor_boundary_seg_v3.pt"
    segmentation_input_size: 640
    segmentation_min_confidence: 0.30
    segmentation_run_rate_hz: 1.0
    segmentation_morph_kernel: 5
    wall_boundary_verify_enabled: false
    wall_surface_class_id: 0
    wall_boundary_class_id: 1
    wall_boundary_model_path: ""
    wall_boundary_min_confidence: 0.25
    wall_boundary_overlap_min: 0.45
    wall_boundary_dilate_px: 12
    wall_boundary_sample_spacing_px: 5.0
    wall_boundary_verify_fail_open: false
    segmentation_min_component_area: 120
    segmentation_max_components: 6
    segmentation_min_line_length_px: 55
    segmentation_mask_line_mode: "centerline"
    wall_surface_edge_approx_epsilon_ratio: 0.012
    wall_surface_edge_refine_px: 7.0
    wall_surface_inner_edge_band_m: 0.18
    wall_surface_inner_edge_percentile: 35.0
    wall_surface_max_edges_per_component: 4
    wall_surface_edge_min_length_m: 0.12
    wall_image_edge_reject_ratio: 0.05    # 노란 선분 중점이 화면 가장자리 5% 안이면 보정에서 제외
    wall_anchor_enabled: false
    wall_anchor_min_lines: 2
    wall_anchor_smoothing: 0.20
    field_half_extent_m: 2.0
    wall_field_max_residual_m: 0.80
    wall_field_smoothing: 0.25

yolo_detector_node:
  ros__parameters:
    camera: "both"                        # A/B: 단일노드(두 모델 한 스레드). 분리는 yolo_top/yolo_body
    top_model_path: "/home/seventt/seventt/workspace/models/wide.pt"
    body_model_path: "/home/seventt/seventt/workspace/models/cube.pt"
    conf_threshold: 0.5
    imgsz: 640
    top_imgsz: 1280
    body_imgsz: 640
    device: "auto"
    top_min_interval_sec: 0.066
    body_min_interval_sec: 0.06
    max_input_age_sec: 0.25              # 추론 대기열에 남은 오래된 프레임은 GPU 투입 전에 폐기한다.
    publish_shape_classification: true
    shape_topic: "/classification/shape"

siglip_gate_node:
  ros__parameters:
    model_id: "google/siglip-base-patch16-224"
    set2_label: "apple"                   # today's Set2 fruit target
    fruit_labels: ["apple", "orange", "banana", "pineapple"]
    confidence_threshold: 0.5             # 이제 softmax MARGIN 임계값(best-2nd). 오픽방지 위해 다소 엄격
    device: "auto"
    min_box_area: 182                     # CLOSE body fruit 게이트. body 640x480 다운스케일에 맞춰 1200 x0.152(면적비)
    target_label: "fruit_photo_cube"      # 이 라벨만 SigLIP로(도형엔 과일종류 무의미)
    aspect_ratio_min: 0.6                 # w/h 하한 — 얼굴면 정면일 때 ~정사각
    aspect_ratio_max: 1.7                 # w/h 상한 — 이 밖이면 각도 나쁨/edge-on → 스킵
    classify_rate_hz: 1.5                 # SigLIP을 매 검출(16Hz)마다 X → 타이머 1.5Hz에서 batch로만(YOLO에 GPU 양보)
    max_batch: 4                          # 한 forward에 넣을 크롭 수 상한(VRAM)
    final_classify_rate_hz: 3.0           # 최종 정지 판정은 빠르게 갱신한다.
    final_classify_max_batch: 1           # 집기 직전에는 중앙 물체 하나만 판정한다.
    final_classify_prefer_centered_crop: true
    final_classify_crop_center_x_px: 320.0
    frame_buffer_size: 12                 # DetectionArray 캡처 시각과 같은 원본 프레임을 보관한다.
    body_frame_buffer_size: 96            # 30fps 기준 3.2초: GPU 지연 뒤에도 최종 Body 원본 crop을 유지.
    wide_frame_buffer_size: 72            # 30fps 기준 2.4초: 광각 YOLO 지연을 흡수하는 힌트용 버퍼.
    frame_match_tolerance_sec: 0.050      # 30fps 인접 프레임까지 허용해 sensor QoS 드롭을 흡수한다.
    detection_frame_wait_max_age_sec: 0.25 # 검출 선착 시 동일 timestamp 이미지가 들어올 때까지 잠시 보류한다.
    # --- TRANSIT 분류 (이동 중 body 백그라운드 저주기 분류; 기본 OFF, 기존 프로파일 무변경) ---
    transit_classify_enabled: false       # true면 transit_classify_states에서 저주기 경로 사용
    transit_classify_min_interval_sec: 0.5  # 이동 중 SigLIP 최소 간격(저주기)
    transit_classify_min_crop_px: 48      # 이동 중 크롭 최소 변(px) — 모션블러 방어
    transit_classify_min_det_conf: 0.60   # 이동 중 YOLO det conf 하한 — 블러 박스 배제
    transit_classify_states: ["SCAN", "APPROACH", "DRIVE_TO_STORAGE"]
    # --- WIDE 백그라운드 분류 (광각 Set2 힌트; 기본 OFF) ---
    # 결과는 /classification/siglip_wide_hint(JSON String)로만 발행 — FSM CLASSIFY 게이트가
    # 구독하는 /classification/siglip에는 절대 실리지 않아 픽 판정을 우회할 수 없다.
    wide_classify_enabled: false
    wide_classify_rate_hz: 1.0            # 광각 SigLIP 레이트 리밋(1Hz)
    wide_classify_min_crop_px: 28         # 광각 크롭 최소 변(px)
    wide_classify_min_det_conf: 0.55      # 광각 det conf 하한
    wide_classify_max_batch: 2            # 한 tick당 크롭 수 상한(큰 것부터)
    wide_hint_min_margin: 0.15            # 이 margin 미만 read는 힌트 발행 안 함
    # --- HSV 색상 일관성 veto (body+wide 공용; 기본 OFF, 보수적 veto 전용) ---
    color_filter_enabled: false
    color_filter_min_expected_fraction: 0.10  # 기대 hue 비율 이 이상이면 절대 veto 안 함(느슨)
    color_filter_dominant_min_fraction: 0.40  # 다른 과일 hue가 이만큼 우세해야 veto 후보
    color_filter_dominance_ratio: 3.0     # 그리고 기대 hue의 3배 이상일 때만
    color_filter_min_colored_fraction: 0.05   # 비백색 픽셀이 이보다 적으면(흰 큐브) veto 안 함
    color_filter_sat_min: 60.0            # 비백색 판정 S 하한(0-255)
    color_filter_val_min: 60.0            # 비백색 판정 V 하한(0-255)
    color_filter_veto_scale: 0.25         # veto 시 margin 하향 배율(is_target은 무조건 false)

world_model_node:
  ros__parameters:
    publish_rate_hz: 10.0
    # wide fisheye projection (verbatim from perception.yaml — GT-validated)
    fisheye_model: true
    image_rotated_180: true
    # Intrinsics SCALED for the 1280x960 GPU-downscaled wide stream (identical to localizer_node
    # above). fx,cx x0.780488; fy,cy x0.779221. dist_coeffs + wide_ground.npz stay unchanged.
    top_fx: 669.125
    top_fy: 670.185
    top_cx: 616.474
    top_cy: 422.141
    dist_coeffs: [-0.085721, 0.053910, -0.034649, 0.007943]
    cam_height_m: 0.885
    cam_pitch_deg: 88.0
    cam_offset_x: 0.204
    cam_offset_y: 0.052
    cam_yaw_deg: 90.0                     # 2026-07-02 재정렬: 물리 관측(정면 물체 매핑)으로 90° 확정
    object_center_height_m: 0.04         # 물체 8cm의 중심높이 → 높이보정 앵커
    # 높이-시차 보정: 지면 호모그래피는 z=0 가정이나 서있는 물체 박스중심은 4cm 높이 → 진짜 지면중심으로 역산.
    # 낮은 본체캠(H≈0.145)이 광각(H≈0.885)보다 훨씬 큰 보정 필요. 두 캠 다 박스중심 앵커로 통일→물체서도 일치.
    height_correct: true
    body_cam_nadir_x: 0.055               # 본체캠 지면 nadir(base_link 앞쪽 m)
    body_cam_nadir_y: 0.0
    body_cam_height_m: 0.155              # 본체캠 바닥 위 높이
    body_radial_trim_m: 0.039             # 본체 앞면바이어스 보정(회전 3614샘플 radial +3.9cm 실측)→광각 중심과 일치
    assoc_radius_m: 0.18                  # 엄격 게이트: 신규트랙 간격 + 중복병합 기준
    reassoc_radius_m: 0.32               # ★관대한 재연관★: 지터/몇프레임 놓쳐도 기존 트랙에 붙음(같은 객체 유지).
                                          # 격자 0.5m보다 작아 실물체는 안 합침. "조금 움직임=같은 물체" 강화
    # 교차검증: 기존 트랙에 안 붙는 새 검출은 즉시 트랙화하지 않고 CANDIDATE로 보류 → candidate_ttl 안에
    # new_track_min_hits번 같은 자리에서 재관측돼야 실제 트랙 생성. 흔들림 1프레임 오검출로 물체 양산되는 근본원인 차단.
    new_track_min_hits: 3                 # 새 물체 확정에 필요한 재관측 횟수(교차검증)
    candidate_ttl_sec: 0.8               # 이 시간 안에 재관측 안 되면 candidate 폐기
    conf_ema: 0.5
    forget_after_sec: 120.0               # persist the whole-field map (static objects)
    # 7x6 경기장 격자 prior. 실제 field 원점/축 검증 전에는 false로 두고 테스트 때만 켠다.
    # 실행 중: ros2 param set /world_model_node grid_prior_enabled true|false
    grid_prior_enabled: true
    grid_prior_debug: true
    grid_rows: 6
    grid_cols: 7
    grid_spacing_m: 0.50
    grid_origin_x_m: -1.50                # 화면 기준 좌상단 첫 격자점: 좌/상 50cm, 하단 100cm 여백
    grid_origin_y_m: -1.50
    grid_initial_phase_sec: 20.0
    grid_initial_snap_radius_m: 0.15
    grid_new_snap_radius_m: 0.12
    grid_initial_snap_alpha: 0.80
    grid_new_snap_alpha: 0.45
    grid_anchor_snap_radius_m: 0.22
    grid_anchor_snap_alpha: 0.90
    grid_anchor_pose_radius_m: 0.35
    grid_track_lock_enabled: true         # 주행 테스트 중 확인된 물체 track을 격자점에 고정한다.
    grid_track_lock_radius_m: 0.26
    grid_track_lock_alpha: 1.0
    zone_anchor_xy: [-1.0, 0.5, -1.0, -1.0, 1.25, -1.25, 0.75, 0.5]
    grid_moved_threshold_m: 0.22
    # 위치 vs 분류 분리 + 음의 증거(FOV 안인데 미검출 시 지속 감점 → 팬텀/집어간 물체 정리)
    class_conf_threshold: 0.85            # 광각 IDENTITY 커트라인(높게): 이 이상만 클래스 투표(광각=위치 위주)
    class_conf_threshold_body: 0.50       # 본체=신원 권위자라 낮은 바에서도 투표(0.6~0.8 octa/icosa도 자기 정체성 확립→과병합 방지)
    plain_cube_confirm_observations: 5    # 최근 유효 라벨 5개가 모두 cube일 때만 순수 일반 큐브로 확정
    body_siglip_assoc_radius_m: 0.18      # 공간 태그 Body SigLIP과 Set2 track 결속 반경.
    fruit_cube_sticky_enabled: false      # 오분류 고착을 막고 이후 shape vote로 재분류를 허용한다
    fruit_cube_sticky_conf_wide: 0.75
    fruit_cube_sticky_conf_body: 0.50
    # --- WIDE SigLIP 과일 힌트 수신 (라우팅 힌트 전용; producer 기본 OFF라 체인은 기본 비활성) ---
    # 힌트는 wide_fruit_votes/fruit_label에만 붙고 fruit_votes/fruit_confidence/confidence/
    # n_obs는 절대 건드리지 않는다(바디 라벨 우선, 픽 게이트 우회 불가).
    wide_fruit_hint_enabled: true
    wide_fruit_hint_assoc_radius_m: 0.35  # 힌트 픽셀 투영점-트랙 매칭 최대 거리
    wide_fruit_hint_min_margin: 0.10      # 이 margin 미만 힌트는 무시(느슨)
    wide_fruit_hint_max_age_sec: 4.0      # Wide YOLO+SigLIP GPU 지연을 포함한 캡처 기준 최대 나이
    # 카메라 커버 도형(base_link): 본체=부채꼴, 광각=전방 타원 (음의증거 판정 + 맵 표시 공용)
    body_fov_half_deg: 30.0               # 실측 footprint 반각 ~30°
    body_fov_near_m: 0.25                # 이미지 하단이 지면 0.29m → 그보다 가까우면 못 봄
    body_fov_far_m: 0.68                 # 캘리브 신뢰 상한(마커 0.68m)
    body_fov_apex_x: 0.065                # 본체캠 전방 오프셋(부채꼴 꼭짓점)
    wide_fov_forward_m: 1.1               # 광각 타원 전방 반축(실측 footprint 앞 -0.5~+1.5)
    wide_fov_lateral_m: 1.3               # 광각 타원 좌우 반축(±1.3)
    wide_fov_center_x: 0.4                # 광각 타원 중심(로봇 앞쪽, 전방편향)
    miss_penalty_per_sec: 0.3             # FOV 안인데 안 보이면 초당 이만큼 감점
    see_window_sec: 0.6                   # 이 시간 이상 미검출이면 miss
    min_keep_conf: 0.05                   # presence 이 아래로 내려가면 트랙 제거
    # object-landmark pose correction (feeds /localization/landmark_correction -> localizer)
    landmark_correction: true
    lock_min_obs: 5                       # observations before a track freezes into an anchor
    lock_min_conf: 0.4
    landmark_min_pairs: 3                 # need >=3 re-observed anchors to solve the rigid drift
    landmark_max_resid_m: 0.30
    unlock_after: 3                       # an anchor off-consensus this many frames = object moved -> unlock
    landmark_spread_ref_m: 0.4            # anchors spread this far (mean radius) = full-confidence heading fix
    landmark_heading_min_pairs: 5         # 회전 보정은 앵커 5개 이상일 때만(그 미만은 dth=0, heading은 VO에 맡김)
    landmark_heading_min_spread_m: 0.30   # 그리고 앵커가 이만큼 넓게 퍼져야 회전 신뢰(좁게 뭉치면 Umeyama 회전이 노이즈)
    # 객체-플로우 오도메트리(광각 점 프레임간 스캔매칭 → /localization/object_odom)
    object_flow: true
    object_flow_min_pairs: 4              # 매칭점 이만큼 이상이어야 신뢰
    object_flow_assoc_m: 0.30            # 프레임간 최근접 게이트(점은 프레임간 거의 안 움직임)
    object_flow_max_dtheta: 0.5          # 프레임당 회전이 이보다 크면 오연관으로 보고 폐기(rad)
    object_flow_trans_deadband_m: 0.008  # 프레임당 sub-cm 이동은 매칭노이즈 → 0(정지 시 랜덤워크 드리프트 방지)
    # body-cam fusion (base-fixed cam; pick homography H = px -> arm_base cm)
    body_homography_path: "/home/seventt/seventt/workspace/data/pick/homography.npz"
    # ArUco 지면 캘리브 적용 (둘 다 회전중심 base_link 미터 프레임 → body_workspace_m 도 base_link 기준):
    # wide: 2.9cm 검증(마커21) / body: 시트20~25 앵커24·25, H분해 높이0.6·좌우0.5cm 독립검증 (2026-07-04)
    wide_homography_path: "/home/seventt/seventt/workspace/data/calib/wide_ground.npz"
    body_ground_homography_path: "/home/seventt/seventt/workspace/data/calib/body_ground.npz"
    arm_base_offset_x: 0.15
    arm_base_offset_y: 0.0
    body_workspace_m: [0.25, 0.68, -0.35, 0.35]   # 본체 지면 footprint·캘리브 유효 근접영역(base_link m)
    # body cam is downscaled 640x480; both body homographies are calibrated at 1640x1232, so upscale
    # each detection pixel back to that domain before perspectiveTransform. npz files stay untouched.
    body_px_scale_x: 2.5625                # 1640/640
    body_px_scale_y: 2.566667             # 1232/480

target_selector_node:
  ros__parameters:
    set1_label: "icosahedron"             # today's Set1 shape target (정이십면체)
    set2_label: "apple"                   # today's Set2 fruit target
    rate_hz: 2.0
    explore_base: 5.0
    set1_base: 20.0                       # Set1 outranks Set2 (approach bias; order enforced by FSM phase)
    set2_base: 10.0
    zone_filter_enabled: true             # FSM의 /planning/zone에 맞춰 선택 후보를 현재 2x2 구역으로 제한
    zone_bounds_m: [-2.0, -0.25, -0.25, 2.0,  -2.0, -0.25, -2.0, -0.25,  -0.25, 2.0, -2.0, -0.25,  -0.25, 2.0, -0.25, 2.0]

mission_fsm_node:
  ros__parameters:
    set1_label: "icosahedron"             # today's Set1 shape target (정이십면체) — 4 placed
    set2_label: "apple"                   # today's Set2 fruit target — 2 placed
    start_phase: 1
    conf_threshold: 0.7
    pick_track_conf: 0.5                   # 타겟 트랙 정체성 신뢰 하한(게이트=프레임전역 아닌 트랙기반)
    approach_dist_m: 0.375                 # 집기 전 ALIGN 전환 거리: 37.5cm
    align_settle_sec: 1.0
    classify_timeout_sec: 3.5             # 트랙기반 게이트(set1 즉시), set2 SigLIP 여유
    classify_body_max_age_sec: 0.60       # 최종 판별에는 CLASSIFY 진입 후의 새 Body 프레임만 사용
    classify_body_settle_sec: 0.40        # ALIGN 완료 후 최종 라벨 투표 전 완전 정지 대기
    classify_body_max_frames: 10          # 목표/동일 비목표 5표가 없을 때 한 번의 판별 최대 프레임
    classify_body_retry_backoff_sec: 0.25 # 판별 불확실 시 한 번만 짧게 후진
    classify_body_retry_settle_sec: 0.40  # 후진 뒤 재판별 전 정지 대기
    classify_octa_wide_final_enabled: true # 옥타만 Wide 라벨로 최종 확인; Body 라벨은 무시
    classify_wide_confirm_frames: 3       # 현재 타깃과 공간 매칭된 새 Wide 옥타 검출 3회
    pick_duration_sec: 11.0               # 그립 닫힘과 팔 복귀 완료 후 다음 주행 시작
    shape_target_total: 4                 # 정십이면체 4개
    fruit_target_total: 0                 # 오렌지 큐브 무시: 정십이면체만 집기
    set2_require_fruit_label: true
    set2_committed_cube_pick_enabled: true # 바나나 선택 위치의 Body 큐브가 집기점에 있으면 빈 면으로 보고 PICK
    grab_x: 0.19                          # 집기점 전방(m). 0.21에서 2cm 더 가까이 잡도록 조정
    grab_min_x: 0.17                      # 이보다 더 가까이 밀지 않음(전진 안전한계)
    storage_x: 1.6                        # 보관함 위치 field xy (좌측하단 구석 안쪽). 실제 빈 위치로 조정
    storage_y: 1.6
    publish_rate_hz: 20.0                  # FSM tick. ALIGN 단위펄스 시간을 50ms 격자로 정밀하게(200/300ms 정확)
    dry_pick: false                       # 실제 /arm/pick_trigger 발행(팔 동작)
    end_after_quota: false                # 쿼터 채우면 보관함(좌측하단)까지 가서 골인(DRIVE_TO_STORAGE→덤프→END)
    select_timeout_sec: 15.0              # graceful phase-advance / END if fewer found
    # body cam downscaled 640x480; ALIGN servo homography(body_ground.npz) is calibrated at 1640x1232.
    # Upscale each body detection pixel to that domain before perspectiveTransform (npz untouched).
    body_px_scale_x: 2.5625               # 1640/640
    body_px_scale_y: 2.566667             # 1232/480
    # 경기 시작 하드코딩 개막 이동(로봇 body 기준): motion_tuning.yaml과 동일하게 유지한다.
    # 이후 phase 1에서 Set1 정이십면체를 탐색/접근한다.
    opening_enabled: true
    startup_warmup_sec: 0.0
    opening_speed: 0.2
    opening_forward_sec: 1.5
    opening_strafe_speed: 0.40
    opening_strafe_right_sec: 0.3
    opening_turn_deg: 90.0
    opening_turn_omega: -0.30
    opening_turn_tolerance_rad: 0.06
    opening_turn_timeout_sec: 7.0
    opening_wait_after_turn_sec: 2.0
    scan_search_omega: -0.255             # 탐색 회전 속도 1.5배 상향: -0.17 -> -0.255
    # ★레인-그래프 waypoint 플래너★ (50cm 물체격자, 40cm 로봇). 이동목표(SCAN 스윕·APPROACH standoff·
    # 보관함)를 충돌없는 레인 중심선으로 라우팅. go_to_goal은 각 via를 car-like+반응형으로 주행.
    planner_enabled: true                 # false면 예전 직접-goal 동작(안전 롤백)
    grid_spacing_m: 0.50                  # 물체 격자 간격
    grid_origin_mode: "infer"             # infer=물체서 위상추론 / fixed=grid_origin_xy 사용
    grid_origin_xy: [0.0, 0.0]
    phase_tol_m: 0.08                     # 물체가 추론격자에 이 안으로 맞아야 신뢰(아니면 fixed 폴백)
    field_bounds_m: [-2.0, 2.0, -2.0, 2.0]   # go_to_goal과 동일(재클램프 방지)
    robot_margin_m: 0.22
    lane_block_radius_m: 0.24             # 물체-레인 거리 이 밑이면 간선 차단(로봇반경0.20+물체0.03+여유0.01)
    comfort_clear_m: 0.35                 # 여유비용 포화 기준
    clearance_weight: 2.0                 # 넓은 레인 선호(좁은 게이트는 최후수단)
    start_connect_k: 4
    wp_reach_tol_m: 0.12                  # 이 안이면 다음 via로(go_to_goal pos_tol 0.05보다 느슨)
    replan_period_sec: 1.5
    replan_goal_move_m: 0.15              # 목적지가 이보다 움직이면 재계획
    replan_throttle_sec: 0.5             # A* 최소 간격(경로 안정)
    obstacle_min_conf: 0.4               # 장애물 팬텀 필터
    obstacle_min_nobs: 2
    exclude_target_radius_m: 0.30        # 목적지 이 안 물체 제외(마지막 접근 leg 도달가능)
    # 탐색 = 스텝방식: 조금 돌고 → 멈춰서 식별 → 다시 돌고 (계속 돌면 모션블러로 트랙 유실)
    search_turn_sec: 0.5                  # 한 스텝 ~20~30° 회전(각도 크면 ↓)
    search_look_sec: 2.5                  # 한번 돌고 2~3초 대기하며 식별(자주 안 돌아도 됨)
    approach_lost_grace_sec: 2.5          # 타겟 순간 사라져도 이 시간은 유지(튀는 재선택 방지)
    approach_standoff_tol: 0.09
    classify_standoff_sec: 2.0            # set2: stand-off서 SigLIP이 과일 타입 정할 때까지 대기(정렬 전). 오렌지 아니면 스킵
    opportunistic_set2_enabled: true
    opportunistic_set2_max_picks: 2
    opportunistic_set2_max_dist_m: 0.70
    opportunistic_set2_min_conf: 0.75
    opportunistic_set2_min_nobs: 3
    # 격자 기준 구역 미션: x=0 가운데 열만 ±10cm 중첩, y는 -0.25m 격자 사이에서 중첩 없이 분리한다.
    zone_mission_enabled: true
    zone_order: [1, 2, 3, 4]
    zone_bounds_m: [-2.0, -0.25, -0.25, 2.0,  -2.0, -0.25, -2.0, -0.25,  -0.25, 2.0, -2.0, -0.25,  -0.25, 2.0, -0.25, 2.0]
    zone_anchor_xy: [-1.0, 0.5, -1.0, -1.0, 1.25, -1.25, 0.75, 0.5]
    zone_no_target_advance_sec: 6.0
    zone_center_reach_tol_m: 0.25
    zone_anchor_slowdown_enabled: true
    zone_anchor_slowdown_distance_m: 0.50
    zone_anchor_slow_speed: 0.07
    zone_stabilize_enabled: true
    zone_stabilize_sec: 3.0
    zone_stabilize_require_fresh_seen: true
    plain_cube_ambiguous_observations: 5
    zone_ambiguous_exclusion_radius_m: 0.18
    align_pulse_sec: 0.10                 # (legacy, 미사용)
    align_distractor_confirm_frames: 5    # ALIGN 완료 후 목표 5표 또는 동일 비목표 5표로 최종 판별
    # ★단위-스텝 보정값★ (2026-07-08 실측, 무부스트+브레이크). 각 방향 거의 일정 이동:
    align_step_fwd_duty: 0.27             # 전진/후진 duty. 직전 저속값 대비 1.5배
    align_step_fwd_sec: 0.15              # 한 번 전/후진 보정 거리: 직전값 대비 1.5배
    align_step_strafe_duty: 0.315         # 좌우 횡이동 미세조정 duty
    align_step_strafe_sec: 0.30           # 한 번 좌우 횡이동 미세조정 시간
    align_step_strafe_mid_sec: 0.60       # 좌우 오차가 클 때 쓰는 긴 횡이동 시간
    align_heading_tolerance_rad: 0.0524   # 재접근 호환값. ALIGN 자체는 회전하지 않음
    align_wide_match_radius_m: 0.30       # 옥타 최종 분류용 raw Wide 관측 연결 최대 거리
    align_wide_max_age_sec: 0.80          # 옥타 최종 분류에서 stale Wide 프레임 차단
    align_body_confirm_frames: 3          # 같은 근거리 물체를 새 Body 프레임 3개에서 확인
    align_body_lost_backoff_enabled: true # ALIGN에서 wide/world에는 있는데 body에 없으면 후진 후 재탐지
    align_body_lost_confirm_sec: 0.40     # 단일 빈 프레임이 아닌 연속 누락만 유실로 확정
    align_body_lost_confirm_frames: 3     # 서로 다른 새 Body 검출 프레임 3회 누락 필요
    align_body_lost_max_backoffs: 2       # 바나나 재획득을 위해 같은 ALIGN 방문에서 후진을 두 번까지 허용
    align_body_lost_reselect_cooldown_sec: 6.0 # 재획득 실패 위치 즉시 재선택 방지
    align_body_lost_backoff_speed: 0.189  # body lost 후진 duty: 0.27의 0.7배
    align_body_lost_backoff_sec: 0.54     # 속도 0.7배 기준 약 10cm 후진
    align_body_lost_backoff_settle_sec: 1.0 # 후진 후 카메라 안정화 대기
    align_settle_pulse_sec: 0.6           # 스텝 후 완전정지 대기(브레이크 있어 더 짧게)
    align_tol_m: 0.02                     # Body y 기준 집기 허용 좌우 오차(±2cm)
    align_fwd_tol_m: 0.02                 # Body x 기준 집기 허용 전후 오차(±2cm)

pick_sequencer_node:
  ros__parameters:
    # 2026-07-08 팀원 재보정값. test_field.launch.py with_arm:=true 실행 시 이 값이 우선 적용된다.
    init_pose: [120.0, 5.0, 100.0]        # 검증된 초기/주행 대기 자세 [어깨, 손목, 그리퍼]
    pick_shoulder_wrist: [25.0, 150.0]    # 집기 도달: 어깨·손목
    place_shoulder_wrist: [110.0, 30.0]   # 놓기: 닫은 채 이동 후 이 위치에서 열기
    grip_open: 118.0                      # 열림/놓기
    grip_closed: 45.0                     # 독립 테스트에서 검증한 닫힘 각도
    move_sec: 1.3                         # 구 설정 파일 호환용(현재는 단계별 시간 사용)
    reach_lift_sec: 1.3                   # REACH/LIFT
    to_place_sec: 1.25                    # 보관함 자세 이동
    stow_sec: 1.0                         # 주행 대기 자세 복귀
    grasp_sec: 0.75                       # 즉시 닫기 명령 유지 후 자동 LIFT
    preopen_sec: 0.2                      # 하강 전 열기
    pick_settle_sec: 0.0                  # REACH 뒤 즉시 GRASP
    servo_speed_dps: 60.0                 # 이전 설정 호환용
    servo_speed_dps_by_channel: [80.0, 120.0, 120.0]

go_to_goal_node:
  ros__parameters:
    control_rate_hz: 20.0
    # ★하이브리드 주행★ (duty, m/s 아님). 실측: 전진 duty 0.10→~0.2m/s, 0.20→~0.67m/s (taper 있음).
    # 맵 안정화를 위해 cruise/floor/turn을 기존 대비 약 1/3로 낮춤.
    kp_lin: 0.8                           # 오차 m당 cruise. 0.22m 넘으면 cruise 포화
    max_lin_speed: 0.0936                 # 출발/ALIGN 제외 일반 목표 주행 속도: 0.117의 0.8배
    min_lin_speed: 0.04                   # 움직이는 최소 duty(스톨하면 0.06~0.08로 올림)
    max_ang_speed: 0.405                  # 목표 바라보는 회전속도 1.5배 상향: 0.27 -> 0.405
    fine_radius_m: 0.15                   # 이 안=홀로노믹 미세, 밖=car-like cruise
    face_tol_rad: 0.35                    # travel: 목표를 이 각(±20°) 안으로 바라봐야 전진 시작
    # 벽 충돌 방지: 로봇 40×40(반경 0.2m), 4×4 경기장(±2). 목표를 이 범위로 클램프해 벽에 안 붙게.
    field_bounds_m: [-2.0, 2.0, -2.0, 2.0]
    robot_margin_m: 0.22                  # 로봇 반경 0.2 + 여유 → 중심이 벽서 22cm 안쪽까지만
    # 물체 회피(포텐셜필드): 몸(40×40)으로 큐브 안 건드리게 매핑된 물체서 밀어냄. 타겟은 제외.
    # 플래너가 레인 선택을 담당하므로 반응형 회피는 '부드러운 중심 정렬 안전망'으로 낮춤(게이트 양쪽 기둥
    # 0.25m를 세게 밀어 전진을 막던 것 완화). 플래너=레인, 반응형=미세 중심보정 공존.
    avoid_radius_m: 0.30                  # 0.55→0.30 (게이트 기둥 겨우 안쪽만 반응)
    avoid_gain: 0.10                      # 0.28→0.10 (약한 자기중심 정렬)
    avoid_goal_skip_m: 0.30              # 목표 근처 이 안의 물체=접근 대상이라 회피 안 함

base_controller_node:
  ros__parameters:
    lx: 0.10
    ly: 0.10
    cmd_timeout_sec: 0.5
    # motion_tuning_log.csv 수렴값(전진 5cm 정확, 17:10 trial3). 무거운 베이스가 이 세기 밑이면 헛돎.
    wheel_scales: [1.0, 1.0, 1.0, 1.0]    # 전진 트림(all-1 수렴)
    # 방향별 횡이동 트림: 직진성은 휠 간 '비율'이 결정하므로 motion_tune 수렴 비율을 유지하되 max=1.0으로
    # 정규화(원값 우 0.7,0.7,0.8,0.7 / 좌 0.65,0.75,0.75,0.65의 절대감쇠는 고정속도 거리튜닝 산물이라 제거).
    # 이러면 속도밴드가 전진/횡이동에 동일 의미 → 횡이동이 약해 스톨하지 않음. 여전히 휘면 이 비율 재튜닝.
    strafe_right_scales: [0.875, 0.875, 1.0, 0.875]
    strafe_left_scales: [0.867, 1.0, 1.0, 0.867]
    wheel_min: 0.06                        # 저속 맵핑용 floor. 직전 저속값 대비 1.5배
    wheel_min_rot: 0.105                   # 제자리 회전 floor 1.5배 상향: 0.07 -> 0.105
    wheel_boost: 0.2925                    # 회전/횡이동 정지→출발 킥 1.5배 상향: 0.195 -> 0.2925
    wheel_boost_ms: 100                    # boost_ms
    wheel_slew_per_tick: 0.02             # 가감속 더더 완만(아주 부드럽게)
    align_wheel_boost: 0.63               # ALIGN 미세정렬 킥. 직전 저속값 대비 1.5배
    align_brake_off: false                # ALIGN 단위-스텝은 브레이크 ON(각 스텝 크리스프 정지 → 보정값과 동일·반복성)
    align_wheel_brake_ms: 120             # ALIGN 전용 역방향 브레이크 시간(ms)
    align_wheel_brake_scale: 0.315        # ALIGN 전용 역펄스 세기
    wheel_deadband: 0.02
    wheel_brake_ms: 120                    # 일반 전후진/횡이동 정지 역펄스 시간. 0=끔
    wheel_brake_scale: 0.315               # 일반 전후진/횡이동 정지 역펄스 세기
    rotation_wheel_brake_ms: 120           # 일반 제자리 회전 정지 전용 역펄스 시간
    rotation_wheel_brake_scale: 0.315      # 일반 제자리 회전 정지 전용 역펄스 세기

explorer_node:
  ros__parameters:
    explore_bounds_m: 1.5
    explore_step_m: 0.5
    yaw_sweep_step_rad: 0.785
    waypoint_settle_sec: 1.0
    scan_state_name: "SCAN"

mcu_bridge_base_node:
  ros__parameters:
    port: "/dev/ttyUSB0"                  # base = CH340 (arm ACM is NOT launched)
    baud: 115200
    publish_encoder_odom: true            # <ODOM,...> 실제 엔코더 기반 휠속도만 odom으로 사용
    publish_heartbeat_as_odom: false      # <HB,...>는 명령 echo라 pose drift 원인이므로 기본 차단
    odom_deadband_mps: 0.005
    odom_scale: 10.544542                       # 실제거리/엔코더거리. open-loop-calib 결과로 갱신
    odom_wheel_scales: [1.0, 1.0, 1.0, 1.0]

recognition_viz_node:
  ros__parameters:
    output_dir: "/home/seventt/seventt/workspace/data/mock_field_test"
    field_extent_m: [-2.0, 2.0, -2.0, 2.0]  # 4×4 경기장(중심원점). 우측하단 시작 (-1.8,1.8)
    auto_extent: false                    # 매 프레임 자동 리사이즈 끔(맵 크기 계속 바뀌어 어지러움 방지)
    map_rotate_180: true                  # 맵을 180° 돌려 광각 피드와 같은 방향으로(보기 편하게)
    canvas_px: 800
    map_margin_px: 48                     # 4×4m 경기장 테두리가 화면 가장자리에 붙지 않도록 안쪽 여백 확보
    snapshot_interval_sec: 0.0            # 0=스냅샷/최종PNG 저장 안 함(live.png만 유지, 누적방지)
    show_window: false                    # 헤드리스/SSH: cv2 창 대신 live.png 만 기록 (창 열면 Qt xcb 크래시)
    show_camera_panels: true              # YOLO-annotated wide + body feeds beside the map
    write_live_png: true                  # overwrite <run>/live.png each redraw (open it in the IDE)
    save_training_data: false             # 라이브 끊김 감소: 학습데이터 저장은 필요할 때만 true
    trail_min_step_m: 0.01                # 정지 중 pose 미세진동은 파란 경로에 추가하지 않음
    training_interval_sec: 1.5            # 저장 주기(초). 검출 있는 프레임만 저장
    trail_max_points: 2000
    redraw_rate_hz: 5.0
    simple_object_labels: true            # true면 맵 물체 라벨을 이름만 간단히 표시
    show_object_grid_points: true
    grid_rows: 6
    grid_cols: 7
    grid_spacing_m: 0.50
    grid_origin_x_m: -1.50                # world_model_node grid prior와 같은 기준
    grid_origin_y_m: -1.50
    show_zone_regions: false              # global 지그재그 모드에서는 구형 zone 표시를 숨김
    zone_bounds_m: [-2.0, -0.25, -0.25, 2.0,  -2.0, -0.25, -2.0, -0.25,  -0.25, 2.0, -2.0, -0.25,  -0.25, 2.0, -0.25, 2.0]
    show_zone_anchors: false
    show_global_zigzag_route: true
    global_zigzag_start_xy: [-1.25, 1.60]
    global_zigzag_waypoints_xy: [-1.25, 1.25, -1.25, -1.25, 1.25, -1.25]
    zone_anchor_xy: [-1.0, 0.5, -1.0, -1.0, 1.25, -1.25, 0.75, 0.5]
    # 맵 FOV 표시(world_model 과 동일값): 본체=부채꼴, 광각=전방 타원
    body_fov_half_deg: 30.0
    body_fov_near_m: 0.25
    body_fov_far_m: 0.68
    body_fov_apex_x: 0.065
    wide_fov_forward_m: 1.1
    wide_fov_lateral_m: 1.3
    wide_fov_center_x: 0.4
