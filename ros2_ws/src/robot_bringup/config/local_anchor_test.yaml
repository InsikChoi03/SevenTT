# Isolated local-anchor test overrides.
# This file is loaded only by local_anchor_test.launch.py; the competition mission does not read it.

local_anchor_test_node:
  ros__parameters:
    # Safety gates.  For a real rotation test set both true, keep the deadman command running,
    # and make sure mission_fsm_node is not running.
    drive_enabled: false
    armed: false
    require_deadman: true
    deadman_timeout_sec: 0.75
    require_competition_running: true
    check_base_command_publishers: true
    relative_topic_timeout_sec: 1.0
    use_imu_yaw: true            # 회전 폐루프는 pose가 아닌 물리 IMU yaw 증분을 직접 누적.
    imu_timeout_sec: 0.5         # IMU가 끊기면 START를 대기시킨다.
    publish_rate_hz: 20.0
    placement_seed: 1             # 실물 배치 사진/좌표 기록에 같이 적을 반복시험 번호.
    single_lap_inspection: true   # 시작 heading부터 시계방향 누적 360도 안에서만 판별.
    initial_inventory_observe_sec: 2.0 # 출발 전 정지 상태로 광각 후보를 먼저 확정한다.

    # Nearby inventory.  Objects outside 12~50 cm are ignored.  Two observations are required
    # before a candidate survives the inventory freeze.
    candidate_labels: [cube, octahedron, dodecahedron, icosahedron, fruit_photo_cube,
      apple, orange, banana, pineapple]
    fruit_inspection_labels: [fruit_photo_cube, apple, orange, banana, pineapple]
    candidate_radius_min_m: 0.12
    candidate_radius_max_m: 0.50
    candidate_merge_radius_m: 0.14
    candidate_merge_bearing_deg: 12.0
    candidate_merge_radial_m: 0.10
    candidate_min_hits: 2
    inventory_max_candidates: 4
    fruit_cube_override_confidence: 0.60 # cube와 함께 검출되면 이 이상은 과일큐브로 확정.
    expected_candidates_min: 3
    expected_candidates_max: 4

    # Rotation: stable-torque pulses fire rapidly until the IMU enters +/-10deg. Then the robot
    # stays stopped and cross-checks IMU with the centred body-camera object before SigLIP.
    scan_step_deg: 45.0
    scan_positions: 8
    turn_omega: 0.10             # 모든 회전 펄스가 사용하는 안정 구동 세기. 저속 연속 회전은 금지.
    turn_slow_omega: 0.07        # 구버전 파라미터 호환용; 현재 회전 명령에는 사용하지 않는다.
    turn_slowdown_deg: 10.0      # 이 범위에 들어오면 빠른 연사를 즉시 멈추고 정지 검증한다.
    turn_pulse_sec: 0.24         # coarse 펄스 이동량을 기존 0.12s의 2배로 확장.
    turn_burst_pause_sec: 0.18   # 펄스 사이 brake+IMU 확인. 기존 0.70s보다 짧아 전체 회전을 가속한다.
    turn_settle_sec: 0.70        # 구버전 파라미터 호환용.
    turn_verify_sec: 0.60        # 정지 후 body 중앙 3프레임을 받을 시간.
    turn_verify_max_corrections: 4
    turn_correction_pulse_sec: 0.10 # 목표 근처/중앙 검증 실패 때 turn_omega로 치는 짧은 보정.
    turn_correction_settle_sec: 0.35
    turn_tolerance_deg: 5.0      # 최종 IMU 오차가 +/-5deg 이내면 회전 완료.
    max_turn_pulses: 60          # 느린 회전에서도 각 45도 목표에 충분히 도달할 여유.
    scan_observe_sec: 1.00       # single_lap=false인 기존 45도 스캔 모드 전용.
    face_observe_sec: 0.75       # 중앙 lock 이후 짧게 안정화하고 SigLIP을 받는다.

    # Body-camera visual heading lock. IMU 누적 360도는 유지하고 후보 방향만 보정한다.
    visual_heading_enabled: true
    visual_heading_min_confidence: 0.60
    visual_heading_center_x_px: 320.0
    visual_heading_center_tolerance_px: 40.0
    visual_heading_confirm_frames: 3
    visual_heading_coarse_gate_deg: 10.0 # +/-10deg 안에서만 body 중앙 관측으로 IMU 오차를 보정.
    visual_heading_max_correction_deg: 20.0

    # Fruit decision.  3Hz SigLIP에서 같은 label 2회면 확정한다.
    target_fruit_label: banana
    classify_min_confidence: 0.08
    classify_stable_frames: 2
    classify_timeout_sec: 4.0
    classify_hold_on_failure: true # 판별 실패 시 UNRESOLVED로 넘기지 않고 그 자리에서 정지.

    # First target fruit immediately cancels the remaining route and enters ALIGN.
    # pick_enabled is injected only by `run_local_anchor_test.sh live`.
    enable_align: true
    pick_enabled: false
    pick_duration_sec: 9.0       # motion_tuning.yaml의 실제 팔 시퀀스보다 길게 base를 잠근다.
    body_align_labels: [fruit_photo_cube, cube] # 접근 중 YOLO가 같은 큐브를 plain cube로 본 프레임도 유지.
    body_ground_homography_path: /home/seventt/seventt/workspace/data/calib/body_ground.npz
    body_px_scale_x: 2.5625
    body_px_scale_y: 2.566667
    body_cam_nadir_x: 0.055
    body_cam_height_m: 0.155
    object_center_height_m: 0.04
    grab_x_m: 0.19
    grab_y_m: 0.0
    grab_min_x_m: 0.17
    align_fwd_tolerance_m: 0.02
    align_lateral_tolerance_m: 0.02
    align_fwd_duty: 0.27
    align_fwd_pulse_sec: 0.15
    align_strafe_duty: 0.315
    align_strafe_pulse_sec: 0.30
    align_adaptive_steps_enabled: true
    align_mid_error_m: 0.06
    align_fwd_mid_pulse_sec: 0.25
    align_strafe_mid_pulse_sec: 0.60
    align_settle_sec: 1.00
    align_target_timeout_sec: 2.0
    align_timeout_sec: 12.0

# Test-only base profile.  These override motion_tuning.yaml only in local_anchor_test.launch.py.
base_controller_node:
  ros__parameters:
    rotation_cw_scales: [1.0, 1.0, 1.0, 1.0]   # 기존 안정 회전을 재현하도록 네 바퀴 동일 출력.
    rotation_ccw_scales: [1.0, 1.0, 1.0, 1.0]  # 방향별 trim은 실측 전까지 적용하지 않는다.
    wheel_min_rot: 0.07          # 테스트 초기값으로 원복(0.04 적용 전 값).
    wheel_boost_rot: 0.35        # 오프닝에서 검증된 정지마찰 탈출 출력.
    wheel_boost_ms: 100          # 출발만 보조하고 이후 0.14 floor로 낮춘다.
    wheel_brake_ms: 120          # Reverse stop pulse.  Lower if the robot rebounds after stopping.
    wheel_brake_scale: 0.315
    wheel_slew_per_tick: 0.06    # 100ms boost 안에 실제 시동 출력까지 도달.

# This override is consumed only by local_anchor_test.launch.py.
siglip_gate_node:
  ros__parameters:
    classify_rate_hz: 3.0        # 기존 1.5Hz보다 빠르게 정지 판별.
    prefer_centered_crop: true   # 현재 바라보는 중앙 과일을 다른 과일보다 우선한다.
    crop_center_x_px: 320.0
    max_batch: 1                 # 중앙 후보만 추론해 지연과 후보 혼선을 함께 줄인다.

# Read-only dashboard for this isolated test.  Port 8080 belongs to the main recognition UI.
local_anchor_web_node:
  ros__parameters:
    web_port: 8082
    web_fps: 8.0
