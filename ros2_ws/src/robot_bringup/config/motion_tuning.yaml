# 경기 주행/인식/정렬 튜닝 프리셋.
#
# 사용 순서:
#   1. 이 파일에서 숫자를 수정한다.
#   2. 아래 명령으로 perception.yaml / test_field.yaml에 반영한다.
#      python3 scripts/apply_motion_tuning.py
#   3. ros2_ws에서 빌드 후 경기 런치를 실행한다.
#
# 단위:
#   *_m   = 미터
#   *_sec = 초
#   *_deg = 도
#   *_rad = 라디안
#   속도/출력값은 현재 베이스 컨트롤러가 쓰는 모터 명령 세기다.

metadata:
  name: match_current             # 튜닝 프리셋 이름. 히스토리 저장 파일명에 사용된다.
  note: "Current octahedron match baseline"  # 프리셋 설명 메모.

targets:
  set1_label: "octahedron"      # 1단계 목표 도형 라벨.
  set2_label: "orange"            # 2단계 목표 과일 라벨. 현재 fruit 목표는 0개라 사실상 미사용.
  shape_target_total: 4           # 경기에서 집을 도형 목표 개수.
  fruit_target_total: 3         # 경기에서 집을 과일 목표 개수. 0이면 과일 단계 비활성에 가깝다.
  target_selector:
    rate_hz: 2.0                  # 목표 후보 선택 노드 실행 주기.
    explore_base: 5.0             # 탐색 후보 기본 점수.
    set1_base: 20.0               # set1 목표 후보 기본 점수. 클수록 우선 선택된다.
    set2_base: 10.0               # set2 목표 후보 기본 점수.
    zone_filter_enabled: true     # 현재 구역 안의 물체만 목표 후보로 볼지 여부다.

opening:
  enabled: true                   # 경기 시작 직후 고정 개막 이동을 사용할지 여부.
  startup_warmup_sec: 15.0        # 시작 후 카메라/YOLO/world_model 준비를 기다리는 시간.
  forward_speed: 0.18             # 개막 전진 명령 세기.
  forward_sec: 1.5                # 개막 전진 시간.
  strafe_right_speed: 0.26        # 개막 오른쪽 횡이동 명령 세기.
  strafe_right_sec: 1.5           # 개막 오른쪽 횡이동 시간.
  turn_deg: 45.0                  # 개막 제자리 회전 목표 각도.
  turn_omega: -0.255              # 개막 회전 명령. 음수는 시계방향.
  wait_after_turn_sec: 1.0        # 개막 회전 후 정지 대기 시간.

scan:
  search_omega: -0.255            # SCAN에서 제자리 탐색 회전 명령. 음수는 시계방향.
  search_turn_sec: 0.5            # 한 번에 회전하는 시간.
  search_look_sec: 2.5            # 회전 후 멈춰서 인식하는 시간.

approach:
  # APPROACH는 광각/월드맵의 목표 위치를 보고 목표 주변까지 이동한 뒤 ALIGN으로 넘긴다.
  align_start_dist_m: 0.35        # 목표와 이 거리 이내가 되면 APPROACH를 끝내고 ALIGN으로 넘어간다.
  face_tol_rad: 0.25              # 목표 방향과 로봇 방향 차이가 이 값 이내일 때 전진한다.
  speed: 0.17                     # APPROACH 전진 단계에서 쓰는 전진 명령 세기.
  kp_ang: 1.0                     # 목표를 향해 회전할 때 heading 오차에 곱하는 비례 게인.
  omega_max: 0.345                # APPROACH 회전 명령 최대값.
  look_sec: 1.0                   # APPROACH 중 매 이동 전 멈춰서 목표를 다시 보는 시간.
  move_sec: 0.5                   # APPROACH에서 한 번 회전하거나 전진하는 시간.
  lost_grace_sec: 2.5             # 목표가 잠깐 사라져도 같은 목표를 유지하는 유예 시간.
  standoff_tol_m: 0.09            # 계획된 접근 지점에 도착했다고 보는 위치 허용오차.
  classify_standoff_sec: 2.0      # set2 과일 판별용 대기 시간. 현재 fruit_target_total=0이면 거의 미사용.

grab:
  # GRAB은 물체를 집을 때 목표 물체가 로봇 기준 좌표에서 어디에 있어야 하는지 정한다.
  x_m: 0.19                       # 집기 순간 목표 물체의 전방 거리. 작을수록 더 가까이 잡는다.
  min_x_m: 0.17                   # 안전상 더 가까이 밀지 않는 전방 최소 거리.
  sonar_range_m: 0.08             # sonar 정렬 사용 시 집기 위치에서 기대하는 전방 초음파 거리.
  sonar_align_enabled: false      # 참이면 전후 정렬을 초음파로, 거짓이면 바디 카메라 x좌표로 한다.

arm:
  # ARM은 물체를 집고 들어 올리는 로봇팔/그리퍼 시퀀스 값을 정한다.
  init_pose: [110.0, 30.0, 50.0]          # 주행 대기 자세 [어깨, 손목, 그리퍼].
  pick_shoulder_wrist: [25.0, 150.0]      # 집기 위해 내려갈 때의 [어깨, 손목] 목표 각도.
  place_shoulder_wrist: [110.0, 30.0]     # 물체를 놓을 때의 [어깨, 손목] 목표 각도.
  grip_open: 115.0                        # 그리퍼를 완전히 열 때의 목표 각도.
  grip_closed: 50.0                       # 그리퍼를 닫아 물체를 잡을 때의 목표 각도.
  move_sec: 4.0                           # 어깨/손목이 목표 자세까지 이동하는 시간.
  grasp_sec: 1.0                          # 그리퍼 열림/닫힘 단계에서 기다리는 시간.
  reach_grip_open_frac: 0.25              # 내려가는 REACH 시간 중 이 비율 안에 그리퍼를 먼저 완전히 연다.

align:
  # ALIGN은 바디 카메라로 목표를 보며 한 축씩 짧게 움직이고, 멈춰서 다시 측정하는 미세조정 단계다.
  settle_sec: 1.0                 # ALIGN 진입 직후 판단/집기 전에 안정화하는 시간.
  fwd_duty: 0.27                  # 전후진 미세조정 짧은 구동의 명령 세기.
  fwd_sec: 0.15                   # 가까울 때 쓰는 짧은 전후진 구동 시간.
  adaptive_steps_enabled: true    # 참이면 오차가 클 때 중간 구동 시간을 사용한다.
  mid_error_m: 0.05               # 선택된 축 오차가 이 값 이상이면 중간 구동을 쓴다. 0.08은 8cm.
  fwd_mid_sec: 0.22               # 전후 오차가 클 때 쓰는 중간 전후진 구동 시간.
  strafe_duty: 0.315              # 좌우 횡이동 미세조정 짧은 구동의 명령 세기.
  strafe_sec: 0.2               # 가까울 때 쓰는 짧은 좌우 횡이동 구동 시간.
  strafe_mid_sec: 0.4          # 좌우 오차가 클 때 쓰는 중간 횡이동 구동 시간.

  body_lost_backoff_enabled: true      # 광각/월드맵에는 목표가 있는데 바디에서 놓치면 후진 복구를 할지 여부다.
  body_lost_backoff_speed: 0.18        # 바디 목표 상실 복구 후진 명령 세기.
  body_lost_backoff_sec: 0.54          # 바디 목표 상실 복구 후진 시간. 현재 대략 10cm 목표다.
  body_lost_backoff_settle_sec: 1.0    # 후진 복구 후 카메라/로봇 안정화 대기 시간.

  settle_pulse_sec: 0.6           # ALIGN 구동 한 번 후 완전히 멈춰서 다시 측정하기까지 기다리는 시간.
  lateral_tol_m: 0.03             # 집기 허용 좌우 오차. 0.03은 좌우 3cm.
  fwd_tol_m: 0.03                 # body 카메라 전후 정렬 기준 집기 허용 전후 오차.
  sonar_tol_m: 0.02               # 초음파 전후 정렬 기준 집기 허용 전후 오차.

zone_mission:
  enabled: true                   # 구역 1->2->3->4 순회 미션을 사용할지 여부.
  order: [1, 2, 3, 4]             # 구역 방문 순서.
  # 각 구역 경계 [xmin, xmax, ymin, ymax] 4개를 이어 쓴 값.
  # 중앙 십자가 부근은 10cm씩 겹치게 해서 맵 오차로 경계 물체를 놓칠 확률을 줄인다.
  bounds_m:
    - -2.0                        # zone1 xmin
    - 0.1                         # zone1 xmax
    - -0.1                        # zone1 ymin
    - 2.0                         # zone1 ymax
    - -2.0                        # zone2 xmin
    - 0.1                         # zone2 xmax
    - -2.0                        # zone2 ymin
    - 0.1                         # zone2 ymax
    - -0.1                        # zone3 xmin
    - 2.0                         # zone3 xmax
    - -2.0                        # zone3 ymin
    - 0.1                         # zone3 ymax
    - -0.1                        # zone4 xmin
    - 2.0                         # zone4 xmax
    - -0.1                        # zone4 ymin
    - 2.0                         # zone4 ymax
  no_target_advance_sec: 6.0      # 현재 구역 중심에서 목표가 없을 때 다음 구역으로 넘어가기 전 대기 시간.
  center_reach_tol_m: 0.25        # 구역 중심에 도착했다고 보는 거리 허용오차.

planner:
  enabled: true                   # 레인 플래너를 사용할지 여부. 거짓이면 직접 목표로 이동한다.
  mode: "lane"                    # 현재 주행 방식. lane은 기존 레인 기반 경로 계획.
  grid_spacing_m: 0.50            # 경기장 물체/레인 격자 간격.
  grid_origin_mode: "infer"       # 격자 원점을 물체 위치에서 추정할지, 고정값을 쓸지 정한다. infer/fixed
  grid_origin_xy: [0.0, 0.0]      # fixed 모드일 때 쓰는 격자 원점.
  phase_tol_m: 0.08               # 물체들이 추정 격자 위상에 맞는지 판단하는 허용오차.
  field_bounds_m: [-2.0, 2.0, -2.0, 2.0]  # 경기장 경계 [xmin, xmax, ymin, ymax].
  robot_margin_m: 0.30            # 벽에서 로봇 중심이 최소로 떨어져야 하는 여유 거리.
  lane_block_radius_m: 0.24       # 물체가 레인에 이 거리보다 가까우면 그 레인을 막힌 것으로 본다.
  comfort_clear_m: 0.35           # 장애물과 이 거리 이상 떨어진 레인을 편한 레인으로 본다.
  clearance_weight: 2.0           # 장애물에서 더 먼 레인을 선호하는 비용 가중치.
  start_connect_k: 4              # 현재 위치를 연결할 후보 레인 노드 개수.
  waypoint_reach_tol_m: 0.12      # 현재 waypoint에 도착했다고 보고 다음 waypoint로 넘기는 거리.
  replan_period_sec: 1.5          # 경로를 주기적으로 다시 계산하는 최소 주기.
  replan_goal_move_m: 0.15        # 목표가 이 거리 이상 움직이면 경로를 다시 계산한다.
  replan_throttle_sec: 0.5        # 너무 자주 재계획하지 않도록 막는 최소 간격.
  obstacle_min_conf: 0.4          # 장애물로 인정할 월드모델 추적의 최소 신뢰도.
  obstacle_min_nobs: 2            # 장애물로 인정할 최소 관측 횟수.
  exclude_target_radius_m: 0.30   # 목표 주변 이 거리 안의 물체는 접근 대상이라 장애물에서 제외한다.

go_to_goal:
  kp_lin: 0.8                     # 목표까지 거리 오차에 곱하는 전진 비례 게인.
  max_lin_speed: 0.0936           # 일반 목표 이동 중 최대 전진 명령 세기.
  min_lin_speed: 0.04             # 전진 명령이 0이 아닐 때 적용하는 최소 명령 세기.
  max_ang_speed: 0.405            # 목표 방향으로 회전할 때 최대 회전 명령.
  fine_radius_m: 0.15             # 목표가 이 거리 안이면 미세 이동 모드로 본다.
  face_tol_rad: 0.35              # 일반 이동 중 목표 방향을 이 각도 안으로 바라봐야 전진한다.
  avoid_radius_m: 0.30            # 반응형 회피가 작동하는 장애물 반경.
  avoid_gain: 0.10                # 장애물에서 밀어내는 반응형 회피 세기.
  avoid_goal_skip_m: 0.30         # 목표 근처 이 거리 안의 물체는 회피하지 않는다.
  front_stop_m: 0.15              # 전방 초음파가 이 거리보다 가까우면 전진을 멈춘다.
  sonar_timeout_sec: 0.5          # 초음파 값이 이 시간보다 오래되면 무시한다.

base_controller:
  wheel_scales: [1.0, 1.0, 1.0, 1.0]              # 각 바퀴 기본 출력 보정값 [FL, FR, RL, RR].
  strafe_right_scales: [0.875, 0.875, 1.0, 0.875] # 오른쪽 횡이동 시 바퀴별 출력 보정값.
  strafe_left_scales: [0.867, 1.0, 1.0, 0.867]    # 왼쪽 횡이동 시 바퀴별 출력 보정값.
  wheel_min: 0.06                  # 일반 주행에서 바퀴가 실제로 돌기 시작하는 최소 명령 세기 보정.
  wheel_min_rot: 0.105             # 제자리 회전에서 바퀴가 실제로 돌기 시작하는 최소 명령 세기 보정.
  wheel_boost: 0.3                 # 정지 상태에서 회전/횡이동 시작 시 넣는 순간 부스트 명령 세기.
  wheel_boost_ms: 100              # 시작 부스트를 유지하는 시간(ms).
  wheel_slew_per_tick: 0.02        # 제어 tick마다 바퀴 명령이 변할 수 있는 최대 변화량.
  align_wheel_boost: 0.63          # ALIGN 미세조정 구동 시작 시 사용하는 부스트 명령 세기.
  align_brake_off: false           # 참이면 ALIGN 정지 브레이크를 끄고, 거짓이면 브레이크를 사용한다.
  wheel_deadband: 0.02             # 이보다 작은 바퀴 명령은 0으로 취급한다.
  wheel_brake_ms: 120              # 이동 후 정지할 때 역방향 브레이크 구동 시간(ms).
  wheel_brake_scale: 0.315         # 브레이크 구동 세기. 직전 바퀴 명령에 곱해진다.

world_model:
  grid_prior_enabled: true        # 물체 위치를 경기장 격자점 쪽으로 보정하는 사전 보정 사용 여부.
  grid_prior_debug: true           # 격자 사전 보정 관련 디버그 표시/정보 사용 여부.
  grid_rows: 6                     # 격자 행 개수.
  grid_cols: 7                     # 격자 열 개수.
  grid_spacing_m: 0.50             # 격자점 사이 거리.
  grid_origin_x_m: -1.50           # 첫 격자점의 field x좌표.
  grid_origin_y_m: -1.50           # 첫 격자점의 field y좌표.
  grid_initial_phase_sec: 20.0     # 경기 초반 격자 보정을 강하게 적용하는 시간.
  grid_initial_snap_radius_m: 0.15 # 초반 새 track을 격자점으로 끌어당기는 최대 거리.
  grid_new_snap_radius_m: 0.12     # 초반 이후 새 track을 격자점으로 끌어당기는 최대 거리.
  grid_initial_snap_alpha: 0.80    # 초반 격자 보정 강도. 1에 가까울수록 격자점에 더 붙는다.
  grid_new_snap_alpha: 0.45        # 초반 이후 격자 보정 강도.
  grid_moved_threshold_m: 0.22     # 물체가 격자 시작 위치에서 이 이상 벗어나면 이동한 물체로 본다.
  body_fov_half_deg: 30.0          # body 카메라 시야각의 반각.
  body_fov_near_m: 0.25            # body 카메라가 볼 수 있다고 보는 최소 거리.
  body_fov_far_m: 0.68             # body 카메라가 볼 수 있다고 보는 최대 거리.
  body_fov_apex_x: 0.065           # body 카메라 시야 부채꼴 꼭짓점의 로봇 전방 오프셋.
  wide_fov_forward_m: 1.1          # wide 카메라 타원형 시야의 전방 반경.
  wide_fov_lateral_m: 1.3          # wide 카메라 타원형 시야의 좌우 반경.
  wide_fov_center_x: 0.4           # wide 카메라 타원형 시야 중심의 로봇 전방 오프셋.

live_view:
  show_camera_panels: true         # 8080 라이브 화면에 광각/바디 카메라 패널을 함께 표시할지 여부.
  write_live_png: false            # live.png 파일을 매번 디스크에 저장할지 여부. 거짓이 경기 중 가볍다.
  redraw_rate_hz: 3.0              # 라이브 맵 다시 그리기 주기.
