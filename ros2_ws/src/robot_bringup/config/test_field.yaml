# Parameters for the MOCK FIELD TEST (recognition-performance verification, OUTSIDE the arena).
# Overrides only; started by test_field.launch.py. The arm is NOT used in this test — PICK is
# logged only (mission_fsm dry_pick:true), and no arm nodes are launched.
#
# !!! FILL IN before running !!!
#   set1_label / set2_label : the shape and fruit you actually place out
#                             (set1_label one of cube/octahedron/dodecahedron/icosahedron;
#                              set2_label one of apple/orange/banana/pineapple).
#   shape_target_total / fruit_target_total : how many of each you place.
# With the labels left empty the robot still roams + maps + logs recognition (never picks) and
# ends via select_timeout — a valid perception-only smoke run.
#
# Calibration values (wide fisheye intrinsics/extrinsics) are copied verbatim from
# perception.yaml — DO NOT change them. Model / homography / output paths are absolute so they
# resolve regardless of the launch working directory.

localizer_node:
  ros__parameters:
    initial_x: 0.0
    initial_y: 0.0
    initial_theta: 0.0
    publish_rate_hz: 20.0
    use_visual_odometry: true
    use_landmark_correction: false        # no arena walls -> disable cardinal yaw-snap
    use_object_landmarks: true            # correct x/y/theta drift from re-observed mapped objects
    landmark_gain: 0.8                     # 위치 보정 게인↑: 1280 광각 맵이 cm급 정밀 → 절대위치로 드리프트 강하게 상쇄
    landmark_theta_gain: 0.7               # HEADING authority for a confident landmark fix (x conf) — 랜드마크=절대 heading
    landmark_max_step_m: 0.2               # 한 번에 허용하는 위치 보정폭↑(드리프트 즉시 회수)
    landmark_max_step_rad: 0.5             # allow a confident heading fix to correct promptly (still clamped)
    broadcast_tf: true
    # OBJECT-FLOW = 주(主) 회전 소스: 광각 물체점 프레임간 매칭(world_model). LK 옵티컬플로는 진동을
    # 회전으로 착각하지만 물체점은 실제 세계 근거라 정지 시 0을 낸다. 물체 부족 시에만 LK로 폴백.
    use_object_flow: true
    object_flow_min_conf: 0.25            # 이 신뢰도 미만 flow 추정은 무시
    object_flow_stale_sec: 0.5            # flow가 이보다 오래되면 LK VO 폴백 기동
    object_flow_trans: true              # flow의 병진도 적용(회전만 원하면 false)
    fisheye_model: true
    top_fx: 857.316
    top_fy: 860.071
    top_cx: 789.858
    top_cy: 541.748
    dist_coeffs: [-0.085721, 0.053910, -0.034649, 0.007943]

yolo_detector_node:
  ros__parameters:
    # Per-stream 5-class models (wide.pt for the fisheye top cam, cube.pt for the body cam).
    top_model_path: "/home/seventt/seventt/workspace/models/wide.pt"
    body_model_path: "/home/seventt/seventt/workspace/models/cube.pt"
    conf_threshold: 0.5                   # POSITION 커트라인(낮게): 이 이상이면 "뭔가 있다"로 존재/위치에 기여
    imgsz: 640                            # 공용 기본값(스트림별 미지정 시)
    top_imgsz: 1280                       # 광각 wide.pt는 1280으로 학습됨 → 반드시 1280 추론(640이면 정확도 급락)
    body_imgsz: 640                       # 본체 cube.pt는 640 학습 = 640 추론
    device: "auto"
    top_min_interval_sec: 0.12
    body_min_interval_sec: 0.06
    publish_shape_classification: true
    shape_topic: "/classification/shape"

siglip_gate_node:
  ros__parameters:
    model_id: "google/siglip-base-patch16-224"
    set2_label: "orange"                  # today's Set2 fruit target
    fruit_labels: ["apple", "orange", "banana", "pineapple"]
    confidence_threshold: 0.5             # 이제 softmax MARGIN 임계값(best-2nd). 오픽방지 위해 다소 엄격
    device: "auto"
    min_box_area: 1200                    # raise so only CLOSE body fruit boxes classify(크기 게이트)
    target_label: "fruit_photo_cube"      # 이 라벨만 SigLIP로(도형엔 과일종류 무의미)
    aspect_ratio_min: 0.6                 # w/h 하한 — 얼굴면 정면일 때 ~정사각
    aspect_ratio_max: 1.7                 # w/h 상한 — 이 밖이면 각도 나쁨/edge-on → 스킵

world_model_node:
  ros__parameters:
    publish_rate_hz: 10.0
    # wide fisheye projection (verbatim from perception.yaml — GT-validated)
    fisheye_model: true
    image_rotated_180: true
    top_fx: 857.316
    top_fy: 860.071
    top_cx: 789.858
    top_cy: 541.748
    dist_coeffs: [-0.085721, 0.053910, -0.034649, 0.007943]
    cam_height_m: 0.885
    cam_pitch_deg: 88.0
    cam_offset_x: 0.204
    cam_offset_y: 0.052
    cam_yaw_deg: 90.0                     # 2026-07-02 재정렬: 물리 관측(정면 물체 매핑)으로 90° 확정
    object_center_height_m: 0.04         # 물체 8cm의 중심높이 → 높이보정 앵커
    # 높이-시차 보정: 지면 호모그래피는 z=0 가정이나 서있는 물체 박스중심은 4cm 높이 → 진짜 지면중심으로 역산.
    # 낮은 본체캠(H≈0.145)이 광각(H≈0.885)보다 훨씬 큰 보정 필요. 두 캠 다 박스중심 앵커로 통일→물체서도 일치.
    height_correct: true
    body_cam_nadir_x: 0.065               # 본체캠 지면 nadir(base_link 앞쪽 m)
    body_cam_nadir_y: 0.0
    body_cam_height_m: 0.145              # 본체캠 바닥 위 높이
    body_radial_trim_m: 0.039             # 본체 앞면바이어스 보정(회전 3614샘플 radial +3.9cm 실측)→광각 중심과 일치
    assoc_radius_m: 0.15                  # 1280 광각+본체 투영이 cm급 일치 → 반경 축소로 인접 물체 과병합 방지(octa≠cube)
    conf_ema: 0.5
    forget_after_sec: 120.0               # persist the whole-field map (static objects)
    # 위치 vs 분류 분리 + 음의 증거(FOV 안인데 미검출 시 지속 감점 → 팬텀/집어간 물체 정리)
    class_conf_threshold: 0.85            # 광각 IDENTITY 커트라인(높게): 이 이상만 클래스 투표(광각=위치 위주)
    class_conf_threshold_body: 0.50       # 본체=신원 권위자라 낮은 바에서도 투표(0.6~0.8 octa/icosa도 자기 정체성 확립→과병합 방지)
    # 카메라 커버 도형(base_link): 본체=부채꼴, 광각=전방 타원 (음의증거 판정 + 맵 표시 공용)
    body_fov_half_deg: 30.0               # 실측 footprint 반각 ~30°
    body_fov_near_m: 0.25                # 이미지 하단이 지면 0.29m → 그보다 가까우면 못 봄
    body_fov_far_m: 0.68                 # 캘리브 신뢰 상한(마커 0.68m)
    body_fov_apex_x: 0.065                # 본체캠 전방 오프셋(부채꼴 꼭짓점)
    wide_fov_forward_m: 1.1               # 광각 타원 전방 반축(실측 footprint 앞 -0.5~+1.5)
    wide_fov_lateral_m: 1.3               # 광각 타원 좌우 반축(±1.3)
    wide_fov_center_x: 0.4                # 광각 타원 중심(로봇 앞쪽, 전방편향)
    miss_penalty_per_sec: 0.3             # FOV 안인데 안 보이면 초당 이만큼 감점
    see_window_sec: 0.6                   # 이 시간 이상 미검출이면 miss
    min_keep_conf: 0.05                   # presence 이 아래로 내려가면 트랙 제거
    # object-landmark pose correction (feeds /localization/landmark_correction -> localizer)
    landmark_correction: true
    lock_min_obs: 5                       # observations before a track freezes into an anchor
    lock_min_conf: 0.4
    landmark_min_pairs: 3                 # need >=3 re-observed anchors to solve the rigid drift
    landmark_max_resid_m: 0.30
    unlock_after: 3                       # an anchor off-consensus this many frames = object moved -> unlock
    landmark_spread_ref_m: 0.4            # anchors spread this far (mean radius) = full-confidence heading fix
    landmark_heading_min_pairs: 5         # 회전 보정은 앵커 5개 이상일 때만(그 미만은 dth=0, heading은 VO에 맡김)
    landmark_heading_min_spread_m: 0.30   # 그리고 앵커가 이만큼 넓게 퍼져야 회전 신뢰(좁게 뭉치면 Umeyama 회전이 노이즈)
    # 객체-플로우 오도메트리(광각 점 프레임간 스캔매칭 → /localization/object_odom)
    object_flow: true
    object_flow_min_pairs: 4              # 매칭점 이만큼 이상이어야 신뢰
    object_flow_assoc_m: 0.30            # 프레임간 최근접 게이트(점은 프레임간 거의 안 움직임)
    object_flow_max_dtheta: 0.5          # 프레임당 회전이 이보다 크면 오연관으로 보고 폐기(rad)
    object_flow_trans_deadband_m: 0.008  # 프레임당 sub-cm 이동은 매칭노이즈 → 0(정지 시 랜덤워크 드리프트 방지)
    # body-cam fusion (base-fixed cam; pick homography H = px -> arm_base cm)
    body_homography_path: "/home/seventt/seventt/workspace/data/pick/homography.npz"
    # ArUco 지면 캘리브 적용 (둘 다 회전중심 base_link 미터 프레임 → body_workspace_m 도 base_link 기준):
    # wide: 2.9cm 검증(마커21) / body: 시트20~25 앵커24·25, H분해 높이0.6·좌우0.5cm 독립검증 (2026-07-04)
    wide_homography_path: "/home/seventt/seventt/workspace/data/calib/wide_ground.npz"
    body_ground_homography_path: "/home/seventt/seventt/workspace/data/calib/body_ground.npz"
    arm_base_offset_x: 0.15
    arm_base_offset_y: 0.0
    body_workspace_m: [0.25, 0.68, -0.35, 0.35]   # 본체 지면 footprint·캘리브 유효 근접영역(base_link m)

target_selector_node:
  ros__parameters:
    set1_label: "icosahedron"             # today's Set1 shape target (20면체)
    set2_label: "orange"                  # today's Set2 fruit target
    rate_hz: 2.0
    explore_base: 5.0
    set1_base: 20.0                       # Set1 outranks Set2 (approach bias; order enforced by FSM phase)
    set2_base: 10.0

mission_fsm_node:
  ros__parameters:
    set1_label: "icosahedron"             # today's Set1 shape target (20면체) — 3 placed
    set2_label: "orange"                  # today's Set2 fruit target — 2 placed
    conf_threshold: 0.7
    pick_track_conf: 0.5                   # 타겟 트랙 정체성 신뢰 하한(게이트=프레임전역 아닌 트랙기반)
    approach_dist_m: 0.35                  # 본체 가시하한(0.29m) 밖으로 — 정지점서 근접 확인 가능
    align_settle_sec: 1.0
    classify_timeout_sec: 3.5             # 트랙기반 게이트(set1 즉시), set2 SigLIP 여유
    pick_duration_sec: 12.0               # 팔 풀 집기+놓기 사이클(~11.4s)보다 길게 대기
    shape_target_total: 1                 # 정20면체 1개
    fruit_target_total: 1                 # 오렌지 1개
    publish_rate_hz: 5.0
    dry_pick: false                       # 실제 /arm/pick_trigger 발행(팔 동작)
    end_after_quota: true                 # END once both quotas met (skip storage phase)
    select_timeout_sec: 15.0              # graceful phase-advance / END if fewer found

go_to_goal_node:
  ros__parameters:
    control_rate_hz: 20.0
    max_lin_speed: 0.20                   # gentle on an open floor
    max_ang_speed: 1.0

base_controller_node:
  ros__parameters:
    lx: 0.10
    ly: 0.10
    cmd_timeout_sec: 0.5

explorer_node:
  ros__parameters:
    explore_bounds_m: 1.5
    explore_step_m: 0.5
    yaw_sweep_step_rad: 0.785
    waypoint_settle_sec: 1.0
    scan_state_name: "SCAN"

mcu_bridge_base_node:
  ros__parameters:
    port: "/dev/ttyUSB0"                  # base = CH340 (arm ACM is NOT launched)
    baud: 115200

recognition_viz_node:
  ros__parameters:
    output_dir: "/home/seventt/seventt/workspace/data/mock_field_test"
    field_extent_m: [-1.6, 1.6, -1.6, 1.6]  # 고정 범위(3.2m). 물체 대부분 이 안
    auto_extent: false                    # 매 프레임 자동 리사이즈 끔(맵 크기 계속 바뀌어 어지러움 방지)
    map_rotate_180: true                  # 맵을 180° 돌려 광각 피드와 같은 방향으로(보기 편하게)
    canvas_px: 800
    snapshot_interval_sec: 0.0            # 0=스냅샷/최종PNG 저장 안 함(live.png만 유지, 누적방지)
    show_window: false                    # 헤드리스/SSH: cv2 창 대신 live.png 만 기록 (창 열면 Qt xcb 크래시)
    show_camera_panels: true              # YOLO-annotated wide + body feeds beside the map
    write_live_png: true                  # overwrite <run>/live.png each redraw (open it in the IDE)
    trail_max_points: 2000
    redraw_rate_hz: 5.0
    # 맵 FOV 표시(world_model 과 동일값): 본체=부채꼴, 광각=전방 타원
    body_fov_half_deg: 30.0
    body_fov_near_m: 0.25
    body_fov_far_m: 0.68
    body_fov_apex_x: 0.065
    wide_fov_forward_m: 1.1
    wide_fov_lateral_m: 1.3
    wide_fov_center_x: 0.4
